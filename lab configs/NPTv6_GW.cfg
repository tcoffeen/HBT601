interfaces {
    ethernet eth0 {
        address dhcp
        dhcpv6-options {
            duid 00:01:00:01:12:34:56:78:ab:cd:ef:01:23:45
            pd 0 {
                interface lo {
                    address 1
                }
                length 60
            }
            rapid-commit
        }
        hw-id 50:00:00:10:00:00
        ipv6 {
            address {
                autoconf
            }
        }
        mac 50:00:00:10:00:00
    }
    ethernet eth1 {
        address 172.16.0.1/30
        address 2001:db8:0:1::1/64
        hw-id 50:00:00:10:00:01
        mac 50:00:00:10:00:01
    }
    ethernet eth2 {
        hw-id 50:00:00:10:00:02
        mac 50:00:00:10:00:02
    }
    ethernet eth3 {
        hw-id 50:00:00:10:00:03
        mac 50:00:00:10:00:03
    }
    loopback lo {
    }
}
nat {
    source {
        rule 100 {
            outbound-interface {
                name eth0
            }
            source {
                address 192.168.0.0/16
            }
            translation {
                address masquerade
            }
        }
    }
}
nat66 {
    destination {
        rule 100 {
            destination {
                address <External_NPTv6_Prefix>::/60
            }
            inbound-interface {
                name eth1
            }
            translation {
                address 3fff:1d00:3001:1d30::/60
            }
        }
    }
    source {
        rule 100 {
            outbound-interface {
                name eth0
            }
            source {
                prefix 3fff:1d00:3001:1d30::/60
            }
            translation {
                address <External_NPTv6_Prefix>::/60
            }
        }
    }
}
protocols {
    static {
        route 172.16.0.0/24 {
            next-hop 172.16.0.2 {
            }
        }
        route 192.168.0.0/16 {
            next-hop 172.16.0.2 {
            }
        }
        route6 3FFF:1D00:3001:1D30::/60 {
            next-hop 2001:db8:0:1::2 {
            }
        }
    }
}
service {
    ntp {
        allow-client {
            address 127.0.0.0/8
            address 169.254.0.0/16
            address 10.0.0.0/8
            address 172.16.0.0/12
            address 192.168.0.0/16
            address ::1/128
            address fe80::/10
            address fc00::/7
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
}
system {
    config-management {
        commit-revisions 100
    }
    console {
        device ttyS0 {
            kernel
            speed 115200
        }
    }
    host-name new-NPTv6
    login {
        operator-group default {
            command-policy {
                allow "*"
            }
        }
        user vyos {
            authentication {
                encrypted-password ****************
                plaintext-password ****************
            }
        }
    }
    option {
        reboot-on-upgrade-failure 5
    }
    syslog {
        local {
            facility all {
                level info
            }
            facility local7 {
                level debug
            }
        }
    }
}

