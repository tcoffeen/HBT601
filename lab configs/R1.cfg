version 15.8
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 172.16.0.2 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
 ipv6 address 2001:DB8:0:1::2/64
 ipv6 enable
 ipv6 nd prefix default no-advertise
!
interface GigabitEthernet0/1
 ip address 192.168.50.1 255.255.255.0
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
 ipv6 address 3FFF:1D00:3001:1D32::1/64
 ipv6 enable
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/2
 ip address 172.16.0.5 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
 ipv6 address 2001:DB8:0:2::A/64
 ipv6 enable
 ipv6 nd prefix default no-advertise
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/3
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
router ospfv3 1
 router-id 0.0.0.1
 !
 address-family ipv6 unicast
  default-information originate
 exit-address-family
!
router ospf 1
 router-id 0.0.0.1
 default-information originate
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 172.16.0.1
ip route 172.16.0.0 255.255.255.0 172.16.0.1
!
ipv6 route ::/0 GigabitEthernet0/0 FE80::5200:FF:FE10:1
ipv6 ioam timestamp
!
!
!
control-plane
!
banner exec ^C
